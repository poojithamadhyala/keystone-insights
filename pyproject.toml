[project]
name = "leaselens"
version = "0.1.0"
description = "Property-management reporting platform with an AI agent (synthetic data)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "faker>=30",
  "numpy>=1.26",
]

# Heavy deps live in groups so the API image stays small (see DECISIONS.md D-002).
[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.16.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["api", "data", "rag", "graph", "ml", "monitoring", "evals", "common"]
markers = ["db: needs a running Postgres (make up)"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "data/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["web/", "migrations/"]
